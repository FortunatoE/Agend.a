<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agend.a</title><style>
:root{--night:#123d2c;--green:#23724a;--lime:#c6dd70;--paper:#f6f8f4;--ink:#16352a;--soft:#eaf0ea;--card:#fff;--line:#d9e5dc;--muted:#64776d;--red:#c64a43;--amber:#c98226;--shadow:0 8px 24px #102e2010}[data-theme="dark"]{--night:#0b2219;--green:#5fbd85;--lime:#d6e98e;--paper:#101914;--ink:#edf5ef;--soft:#18271e;--card:#17231c;--line:#2b4133;--muted:#a8b9ad;--red:#fc837b;--amber:#f4b664;--shadow:0 8px 24px #0005}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px ui-sans-serif,system-ui,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}header{height:70px;background:var(--night);color:#eaf5ed;display:flex;align-items:center;gap:22px;padding:0 clamp(16px,4vw,52px);position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:850;letter-spacing:-1px;margin-right:8px;white-space:nowrap}.brand b{background:var(--lime);color:var(--night);border-radius:8px;padding:2px 7px;margin-right:7px}.nav{display:flex;gap:3px;height:100%;align-items:center;overflow:auto}.nav button{border:0;background:transparent;color:#bcd2c3;height:100%;padding:0 10px;font-weight:600;font-size:13px;white-space:nowrap}.nav button.active,.nav button:hover{color:#fff;box-shadow:inset 0 -3px var(--lime)}.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.icon{border:1px solid #527461;background:transparent;color:#d4e8db;border-radius:8px;min-width:35px;height:35px}.person{text-align:right;white-space:nowrap;font-size:13px}.person small{display:block;color:#a7c8b2;font-size:11px}.wrap{max-width:1440px;padding:32px clamp(16px,4vw,52px);margin:auto}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:15px}.eyebrow{color:var(--green);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.12em}.intro h1{font-size:29px;letter-spacing:-.8px;margin:5px 0}.sub{margin:0;color:var(--muted);line-height:1.45}.primary{border:0;background:var(--green);color:#fff;padding:11px 15px;border-radius:8px;font-weight:750}.areas,.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:23px 0 16px}.area,.tab{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:7px 11px;color:var(--muted)}.area.active,.tab.active{background:#e3f0dc;color:#285935;border-color:#afd17e;font-weight:750}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}.stat{padding:17px}.stat span{color:var(--muted);font-size:12px}.stat strong{font-size:28px;display:block;margin:6px 0}.stat em{color:var(--green);font-style:normal;font-size:12px}.panel{padding:17px;margin-top:15px;box-shadow:var(--shadow)}.panel h2{font-size:16px;margin:0 0 13px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--card)}.dot{width:9px;height:9px;background:var(--lime);border-radius:50%;flex:none}.item b{font-size:13px}.item small{display:block;color:var(--muted);margin-top:3px}.item time{margin-left:auto;font-size:12px;color:var(--muted)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:var(--soft);border-radius:12px;padding:11px;min-height:410px}.col h3{font-size:13px;margin:3px 2px 11px;display:flex;justify-content:space-between}.count{background:#d6e2d8;color:#24432f;padding:2px 7px;border-radius:10px;font-size:11px}.card{background:var(--card);border-radius:9px;border-left:4px solid var(--lime);padding:12px;margin:8px 0;box-shadow:0 1px 2px #123d2b0c;cursor:pointer}.card.high{border-color:var(--red)}.card.medium{border-color:var(--amber)}.card b{font-size:13px;line-height:1.35}.card p{font-size:12px;line-height:1.4;color:var(--muted);margin:7px 0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.calendar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.period{background:var(--soft);border-radius:10px;padding:11px;min-height:135px}.period h3{font-size:12px;margin:0 0 7px}.event{font-size:11px;background:#e6f2df;color:#2d5a36;border-radius:5px;padding:5px;margin-top:5px;line-height:1.25}.routine,.report{display:grid;grid-template-columns:1.25fr 1fr 1fr 100px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.report{grid-template-columns:180px 1fr 95px}.bar{height:8px;background:var(--soft);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:5px}.empty{padding:26px;text-align:center;color:var(--muted)}.badge{font-size:11px;border-radius:5px;padding:4px 7px;background:#e6f2df;color:#2d5a36;display:inline-block}.notice{border-left:4px solid var(--amber);padding:12px;background:#fff6e8;color:#5d431e;border-radius:7px}.access-row{display:grid;grid-template-columns:1.2fr 1fr repeat(4,90px);gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.access-row label{display:flex;gap:4px;align-items:center}.overlay{position:fixed;inset:0;background:#0b2118aa;display:none;place-items:center;padding:16px;z-index:20}.overlay.open{display:grid}.dialog{background:var(--card);width:min(690px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:23px;box-shadow:0 18px 60px #0005}.dialog h2{margin:0 0 15px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:750}.form input,.form select,.form textarea{width:100%;margin-top:5px;border:1px solid var(--line);color:var(--ink);background:var(--card);border-radius:7px;padding:10px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.plain{background:var(--soft);color:var(--ink);border:0;border-radius:8px;padding:10px 13px}.detail-section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.check{display:flex;gap:8px;align-items:center;padding:6px 0}.comment{border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}.comment small{color:var(--muted);display:block;margin-top:3px}.attachments a{display:block;padding:6px 0;color:var(--green);font-size:13px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0d2c20,#234f38)}.login-card{width:min(420px,calc(100% - 32px));background:#fff;color:#18392b;padding:32px;border-radius:16px;box-shadow:0 22px 80px #0005}.login-card .brand{color:#123d2c;margin-bottom:25px}.login-card input{border:1px solid #cedbd1;border-radius:8px;padding:11px;width:100%;margin-top:5px}.login-card label{display:block;font-size:13px;font-weight:700;margin:12px 0}.login-card button{width:100%;margin-top:14px}.error{color:#bd3d37;font-size:13px;margin-top:10px}.toast{position:fixed;bottom:20px;right:20px;background:var(--night);color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:30}.toast.show{display:block}@media(max-width:900px){.person{display:none}.wrap{padding:24px 16px}.stats,.board{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.routine{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:repeat(2,1fr)}.access-row{grid-template-columns:1fr 1fr}.access-row button{grid-column:1/-1}}@media(max-width:520px){header{height:62px;padding:0 14px;gap:9px}.brand{font-size:19px}.nav button:nth-child(n+4){display:none}.intro{align-items:flex-start;flex-direction:column}.stats,.board,.twocol{grid-template-columns:1fr}.calendar{grid-template-columns:1fr}.routine,.report{grid-template-columns:1fr}}
</style></head><body><div id="loginScreen" class="login"><form class="login-card" id="loginForm"><div class="brand"><b>◒</b>Agend.a</div><h1>Entrar na operação</h1><p class="sub">Use seu usuário e senha para acessar as atividades da equipe.</p><label>Usuário<input id="loginUser" autocomplete="username" placeholder="emmanuel.fortunato" required></label><label>Senha<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="primary">Entrar</button><p class="error" id="loginError"></p></form></div><div id="app" hidden><header><div class="brand"><b>◒</b>Agend.a</div><nav class="nav"><button class="active" data-view="overview">Visão geral</button><button data-view="kanban">Kanban</button><button data-view="calendar">Calendário</button><button data-view="routines">Rotinas</button><button data-view="reports">Relatórios</button><button data-view="settings" id="settingsNav" hidden>Configurações</button></nav><div class="header-actions"><button class="icon" id="notifications" title="Notificações">●</button><button class="icon" id="theme" title="Alternar tema">◐</button><div class="person"><b id="personName"></b><small id="personRole"></small></div><button class="icon" id="logout" title="Sair">↪</button></div></header><main class="wrap"><div class="intro"><div><div class="eyebrow">Operação da equipe</div><h1 id="heading">Visão geral</h1><p class="sub" id="today"></p></div><button class="primary" id="newTask">+ Nova atividade</button></div><div class="areas" id="areas"></div><section class="view active" id="overview"></section><section class="view" id="kanban"></section><section class="view" id="calendar"></section><section class="view" id="routines"></section><section class="view" id="reports"></section><section class="view" id="settings"></section></main></div><div class="overlay" id="modal"></div><div class="toast" id="toast"></div><script>
const areas=['Todas','Administrativo','Logística · Defensivo','Logística · Adubo','Planejamento'],statuses=['todo','andamento','revisão','concluída'],labels={todo:'A fazer',andamento:'Em andamento',revisão:'Em revisão',concluída:'Concluídas'};let tasks=[],filter='Todas',view='overview',calendarMode='mensal',current=null;const $=s=>document.querySelector(s),fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'Sem prazo',day=d=>new Date(d+'T12:00'),scoped=()=>filter==='Todas'?tasks:tasks.filter(t=>t.area===filter),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(url,opts={}){let r=await fetch(url,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Não foi possível concluir a operação.');return data}function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2800)}
function can(action){return current?.is_admin||current?.['can_'+action]}function renderAreas(){$('#areas').innerHTML=areas.map(a=>'<button class="area '+(a===filter?'active':'')+'" onclick="chooseArea('+JSON.stringify(a)+')">'+a.replace('Logística · ','')+'</button>').join('')}
function card(t){return '<article class="card '+(t.priority==='alta'?'high':t.priority==='média'?'medium':'')+'" onclick="detail('+t.id+')"><b>'+esc(t.title)+'</b><p>'+esc(t.description)+'</p><div class="meta"><span>'+esc(t.assignee)+'</span><span>'+fmt(t.due_date)+'</span></div></article>'}
function overview(){let a=scoped(),done=a.filter(t=>t.status==='concluída').length,late=a.filter(t=>t.due_date&&t.due_date<new Date().toISOString().slice(0,10)&&t.status!=='concluída').length;$('#overview').innerHTML='<div class="stats"><div class="stat"><span>Atividades</span><strong>'+a.length+'</strong><em>na área selecionada</em></div><div class="stat"><span>Em andamento</span><strong>'+a.filter(t=>t.status==='andamento').length+'</strong><em>em execução</em></div><div class="stat"><span>Concluídas</span><strong>'+done+'</strong><em>'+Math.round(done/(a.length||1)*100)+'% do total</em></div><div class="stat"><span>Atrasadas</span><strong>'+late+'</strong><em style="color:var(--red)">pedem atenção</em></div></div><div class="grid2"><div class="panel"><h2>Próximas entregas</h2><div class="list">'+a.slice(0,6).map(t=>'<div class="item" onclick="detail('+t.id+')"><i class="dot"></i><div><b>'+esc(t.title)+'</b><small>'+esc(t.area)+' · '+esc(t.assignee)+'</small></div><time>'+fmt(t.due_date)+'</time></div>').join('')+'</div></div><div class="panel"><h2>Controle de operação</h2><p class="sub">As ações ficam registradas no histórico de cada atividade. Use os detalhes para anexar evidências, comentar ou acompanhar o checklist.</p><p class="sub" style="margin-top:14px">Tema: <b>'+($('#app').dataset.theme==='dark'?'escuro':'claro')+'</b></p></div></div>'}
function kanban(){$('#kanban').innerHTML='<div class="panel"><h2>Fluxo de trabalho</h2><p class="sub">Abra uma atividade para alterar seu status e registrar evidências.</p><div class="board">'+statuses.map(s=>{let a=scoped().filter(t=>t.status===s);return '<div class="col"><h3>'+labels[s]+' <span class="count">'+a.length+'</span></h3>'+a.map(card).join('')+(a.length?'':'<div class="empty">Sem atividades</div>')+'</div>'}).join('')+'</div></div>'}
function periodKey(t){let d=day(t.due_date);if(calendarMode==='diário')return d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'});if(calendarMode==='semanal'){let s=new Date(d);s.setDate(d.getDate()-d.getDay());return 'Semana de '+s.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}if(calendarMode==='anual')return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function calendar(){let groups={};scoped().filter(t=>t.due_date).forEach(t=>(groups[periodKey(t)]??=[]).push(t));$('#calendar').innerHTML='<div class="tabs">'+['anual','mensal','semanal','diário'].map(m=>'<button class="tab '+(m===calendarMode?'active':'')+'" onclick="setCalendar('+JSON.stringify(m)+')">'+m[0].toUpperCase()+m.slice(1)+'</button>').join('')+'</div><div class="panel"><h2>Agenda '+calendarMode+'</h2><div class="calendar">'+Object.entries(groups).map(([k,list])=>'<div class="period"><h3>'+k+'</h3>'+list.map(t=>'<div class="event" onclick="detail('+t.id+')">'+esc(t.title)+' · '+fmt(t.due_date)+'</div>').join('')+'</div>').join('')+'</div></div>'}
function routines(){let a=scoped().filter(t=>t.recurrence!=='não se repete');$('#routines').innerHTML='<div class="panel"><h2>Atividades recorrentes</h2>'+(a.map(t=>'<div class="routine"><div><b>'+esc(t.title)+'</b><small class="sub" style="display:block">'+esc(t.area)+' · '+esc(t.assignee)+'</small></div><div><span class="badge">'+esc(t.recurrence)+'</span></div><div class="bar"><i style="width:'+t.progress+'%"></i></div><div>'+t.progress+'%</div></div>').join('')||'<div class="empty">Nenhuma rotina encontrada.</div>')+'</div>'}
function reports(){$('#reports').innerHTML='<div class="panel"><h2>Produtividade por área</h2>'+areas.slice(1).map(a=>{let x=tasks.filter(t=>t.area===a),d=x.filter(t=>t.status==='concluída').length,p=Math.round(d/(x.length||1)*100);return '<div class="report"><b>'+a+'</b><div class="bar"><i style="width:'+p+'%"></i></div><span>'+d+'/'+x.length+' concluídas</span></div>'}).join('')+'</div><div class="panel"><h2>Carga de trabalho</h2>'+['Colaborador 1','Colaborador 2','Colaborador 3','Colaborador 4'].map(u=>{let n=tasks.filter(t=>t.assignee===u&&t.status!=='concluída').length;return '<div class="report"><b>'+u+'</b><div class="bar"><i style="width:'+Math.min(100,n*20)+'%"></i></div><span>'+n+' abertas</span></div>'}).join('')+'</div>'}
async function settings(){if(!current?.is_admin)return;let users=await api('/api/users');$('#settings').innerHTML='<div class="panel"><h2>Configurações › Acesso › Controle de acesso</h2><p class="sub">O administrador define quem pode criar, editar e excluir atividades.</p><div id="accessList">'+users.map(u=>'<div class="access-row" data-user="'+u.id+'"><div><b>'+esc(u.name)+'</b><small class="sub" style="display:block">@'+esc(u.username)+'</small></div><label><input type="checkbox" data-k="is_admin" '+(u.is_admin?'checked':'')+'> Administrador</label><label><input type="checkbox" data-k="can_create" '+(u.can_create?'checked':'')+'> Criar</label><label><input type="checkbox" data-k="can_edit" '+(u.can_edit?'checked':'')+'> Editar</label><label><input type="checkbox" data-k="can_delete" '+(u.can_delete?'checked':'')+'> Excluir</label><button class="plain" onclick="saveUser('+u.id+')">Salvar</button></div>').join('')+'</div></div><div class="panel"><h2>Novo usuário</h2><form class="form" id="userForm"><div class="twocol"><label>Nome<input id="newName" required></label><label>Usuário<input id="newUsername" required placeholder="nome.sobrenome"></label></div><div class="twocol"><label>Senha temporária<input id="newPassword" type="password" required></label><label>Perfil<select id="newRole"><option value="collab">Colaborador</option><option value="manager">Gestor</option><option value="admin">Administrador</option></select></label></div><div class="actions"><button class="primary">Criar usuário</button></div></form></div>';$('#userForm').onsubmit=createUser}
function render(){renderAreas();overview();kanban();calendar();routines();reports();if(current?.is_admin)settings();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===view));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));$('#heading').textContent={overview:'Visão geral',kanban:'Kanban',calendar:'Calendário',routines:'Rotinas',reports:'Relatórios',settings:'Configurações'}[view];$('#newTask').hidden=!can('create')}
function chooseArea(a){filter=a;render()}function setCalendar(m){calendarMode=m;calendar()}async function load(){tasks=await api('/api/tasks');render()}async function advance(id){let t=tasks.find(x=>x.id===id),next=statuses[(statuses.indexOf(t.status)+1)%statuses.length];await api('/api/tasks',{method:'PATCH',body:JSON.stringify({id,status:next})});toast('Status atualizado.');load()}
function taskModal(){return '<div class="dialog"><h2>Nova atividade</h2><form class="form" id="taskForm"><label>Título<input id="title" required></label><label>Descrição<textarea id="description" rows="3"></textarea></label><div class="twocol"><label>Área<select id="areaSelect">'+areas.slice(1).map(a=>'<option>'+a+'</option>').join('')+'</select></label><label>Responsável<select id="assignee"><option>Colaborador 1</option><option>Colaborador 2</option><option>Colaborador 3</option><option>Colaborador 4</option></select></label></div><div class="twocol"><label>Prazo<input id="dueDate" type="date" required></label><label>Prioridade<select id="priority"><option>normal</option><option>média</option><option>alta</option></select></label></div><label>Recorrência<select id="recurrence"><option>não se repete</option><option>diária</option><option>semanal</option><option>mensal</option><option>anual</option></select></label><div class="actions"><button class="plain" type="button" onclick="closeModal()">Cancelar</button><button class="primary">Criar atividade</button></div></form></div>'}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}async function newTask(){if(!can('create'))return toast('Seu perfil não pode criar atividades.');$('#modal').innerHTML=taskModal();$('#modal').classList.add('open');$('#taskForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('#title').value,description:$('#description').value,area:$('#areaSelect').value,assignee:$('#assignee').value,due_date:$('#dueDate').value,priority:$('#priority').value,recurrence:$('#recurrence').value})});closeModal();toast('Atividade criada.');load()}catch(e){toast(e.message)}}}
async function detail(id){let task=tasks.find(t=>t.id===id),data=await api('/api/task-detail?task_id='+id);$('#modal').innerHTML='<div class="dialog"><div class="actions" style="float:right"><button class="plain" onclick="closeModal()">Fechar</button></div><h2>'+esc(task.title)+'</h2><p class="sub">'+esc(task.description)+'</p><p><span class="badge">'+esc(task.area)+'</span> <span class="badge">'+esc(task.status)+'</span> '+(can('edit')?'<button class="plain" onclick="advance('+id+')">Avançar status</button>':'')+'</p><div class="detail-section"><h3>Checklist</h3>'+data.checklist.map(i=>'<label class="check"><input type="checkbox" '+(i.done?'checked':'')+' onchange="toggleCheck('+id+','+i.id+')"> '+esc(i.label)+'</label>').join('')+(can('edit')?'<div class="actions"><input id="checkLabel" placeholder="Nova etapa"><button class="plain" onclick="addCheck('+id+')">Adicionar</button></div>':'')+'</div><div class="detail-section"><h3>Comentários</h3>'+data.comments.map(c=>'<div class="comment"><b>'+esc(c.author)+'</b> '+esc(c.message)+'<small>'+new Date(c.created_at).toLocaleString('pt-BR')+'</small></div>').join('')+'<div class="actions"><input id="commentText" placeholder="Escreva um comentário"><button class="plain" onclick="comment('+id+')">Enviar</button></div></div><div class="detail-section"><h3>Anexos</h3><div class="attachments">'+data.attachments.map(a=>'<a target="_blank" href="/api/attachment?path='+encodeURIComponent(a.pathname)+'">⌁ '+esc(a.filename)+'</a>').join('')+'</div>'+(can('edit')?'<input type="file" id="uploadFile" onchange="uploadFile('+id+',this)">':'')+'</div><div class="detail-section"><h3>Histórico</h3>'+data.history.map(h=>'<div class="comment"><b>'+esc(h.author)+'</b> '+esc(h.detail)+'<small>'+new Date(h.created_at).toLocaleString('pt-BR')+'</small></div>').join('')+'</div></div>';$('#modal').classList.add('open')}
async function refreshDetail(id){await load();detail(id)}async function addCheck(id){let label=$('#checkLabel').value;if(!label)return;await api('/api/task-detail',{method:'POST',body:JSON.stringify({task_id:id,action:'checklist_add',label})});refreshDetail(id)}async function toggleCheck(id,item){await api('/api/task-detail',{method:'POST',body:JSON.stringify({task_id:id,action:'checklist_toggle',item_id:item})});refreshDetail(id)}async function comment(id){let message=$('#commentText').value;if(!message)return;await api('/api/task-detail',{method:'POST',body:JSON.stringify({task_id:id,action:'comment',message})});refreshDetail(id)}async function uploadFile(id,input){let f=input.files[0];if(!f)return;if(f.size>4*1024*1024)return toast('Envie anexos de até 4 MB.');let reader=new FileReader();reader.onload=async()=>{try{await api('/api/upload',{method:'POST',body:JSON.stringify({task_id:id,filename:f.name,content_type:f.type,data:String(reader.result).split(',')[1]})});toast('Anexo enviado.');refreshDetail(id)}catch(e){toast(e.message)}};reader.readAsDataURL(f)}
async function createUser(e){e.preventDefault();let profile=$('#newRole').value;try{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('#newName').value,username:$('#newUsername').value,password:$('#newPassword').value,is_admin:profile==='admin',can_create:true,can_edit:profile!=='collab'||true,can_delete:profile==='admin'})});toast('Usuário criado.');settings()}catch(e){toast(e.message)}}async function saveUser(id){let row=document.querySelector('[data-user="'+id+'"]'),read=k=>row.querySelector('[data-k="'+k+'"]').checked;try{await api('/api/users',{method:'PATCH',body:JSON.stringify({id,is_admin:read('is_admin'),can_create:read('can_create'),can_edit:read('can_edit'),can_delete:read('can_delete')})});toast('Acessos atualizados.')}catch(e){toast(e.message)}}
async function login(e){e.preventDefault();try{let r=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'login',username:$('#loginUser').value,password:$('#loginPassword').value})});start(r.user)}catch(e){$('#loginError').textContent=e.message}}async function start(user){current=user;$('#loginScreen').hidden=true;$('#app').hidden=false;$('#personName').textContent=user.name;$('#personRole').textContent=user.is_admin?'Administrador':'Colaborador';$('#settingsNav').hidden=!user.is_admin;await load()}async function boot(){let r=await api('/api/auth');if(r.user)start(r.user)}$('#loginForm').onsubmit=login;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#newTask').onclick=newTask;$('#logout').onclick=async()=>{await api('/api/auth',{method:'POST',body:JSON.stringify({action:'logout'})});location.reload()};$('#theme').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;$('#app').dataset.theme=t;localStorage.setItem('agenda-theme',t);render()};$('#notifications').onclick=()=>{let today=new Date().toISOString().slice(0,10),n=tasks.filter(t=>t.due_date&&t.due_date<=today&&t.status!=='concluída');toast(n.length?n.length+' atividade(s) exigem atenção.':'Nenhuma pendência urgente.')};let saved=localStorage.getItem('agenda-theme')||'light';document.documentElement.dataset.theme=saved;$('#app').dataset.theme=saved;$('#today').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());boot();
</script></body></html>
