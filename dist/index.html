<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agend.a</title><style>
:root{--night:#123d2c;--green:#23724a;--lime:#c3dc6a;--paper:#f6f8f4;--ink:#16352a;--soft:#eaf0ea;--line:#d9e5dc;--muted:#64776d;--red:#c64a43;--amber:#c98226}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px ui-sans-serif,system-ui,sans-serif;color:var(--ink)}header{height:72px;background:var(--night);color:#eaf5ed;display:flex;align-items:center;gap:22px;padding:0 clamp(16px,4vw,52px);position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:850;letter-spacing:-1px;margin-right:8px;white-space:nowrap}.brand b{background:var(--lime);color:var(--night);border-radius:8px;padding:2px 7px;margin-right:7px}.nav{display:flex;gap:3px;align-items:center;overflow:auto;height:100%}.nav button{border:0;background:transparent;color:#bcd2c3;height:100%;padding:0 10px;cursor:pointer;font:600 13px inherit;white-space:nowrap}.nav button.active,.nav button:hover{color:#fff;box-shadow:inset 0 -3px var(--lime)}.person{margin-left:auto;text-align:right;white-space:nowrap;font-size:13px}.person small{display:block;color:#a7c8b2;font-size:11px}.wrap{max-width:1420px;padding:32px clamp(16px,4vw,52px);margin:auto}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:15px}.eyebrow{color:var(--green);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.12em}.intro h1{font-size:29px;letter-spacing:-.8px;margin:5px 0}.sub{margin:0;color:var(--muted)}button.primary{border:0;background:var(--green);color:#fff;padding:12px 15px;border-radius:8px;font-weight:750;cursor:pointer}.areas{display:flex;gap:7px;flex-wrap:wrap;margin:25px 0 17px}.area{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 11px;color:#486254;cursor:pointer}.area.active{background:#e3f0dc;color:#285935;border-color:#afd17e;font-weight:750}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.stat{padding:17px}.stat span{color:var(--muted);font-size:12px}.stat strong{font-size:28px;display:block;margin:6px 0}.stat em{color:var(--green);font-style:normal;font-size:12px}.view{display:none}.view.active{display:block}.panel{padding:17px;margin-top:15px}.panel h2{font-size:16px;margin:0 0 14px}.focus{display:grid;grid-template-columns:1.45fr 1fr;gap:14px}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;padding:11px}.dot{width:9px;height:9px;background:var(--lime);border-radius:50%;flex:none}.item b{font-size:13px}.item small{display:block;color:var(--muted);margin-top:3px}.item time{margin-left:auto;font-size:12px;color:var(--muted)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:var(--soft);border-radius:12px;padding:11px;min-height:410px}.col h3{font-size:13px;margin:3px 2px 11px;display:flex;justify-content:space-between}.count{background:#d6e2d8;padding:2px 7px;border-radius:10px;font-size:11px}.card{background:#fff;border-radius:9px;border-left:4px solid var(--lime);padding:12px;margin:8px 0;box-shadow:0 1px 2px #123d2b0c;cursor:pointer}.card.high{border-color:var(--red)}.card.medium{border-color:var(--amber)}.card b{font-size:13px;line-height:1.35}.card p{font-size:12px;line-height:1.4;color:var(--muted);margin:7px 0}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;min-height:110px}.day>span{font-size:12px;color:var(--muted)}.event{font-size:11px;background:#e6f2df;color:#2d5a36;border-radius:5px;padding:4px;margin-top:6px;line-height:1.25}.routine,.report{display:grid;grid-template-columns:1.25fr 1fr 1fr 100px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.bar{height:8px;background:#edf1ed;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:5px}.report{grid-template-columns:150px 1fr 80px}.empty{padding:26px;text-align:center;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#0c2e2066;place-items:center;padding:16px;z-index:9}.modal.open{display:grid}.dialog{background:#fff;width:min(570px,100%);border-radius:14px;padding:23px}.dialog h2{margin:0 0 15px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:750}.form input,.form select,.form textarea{width:100%;margin-top:5px;border:1px solid #cfdbd1;border-radius:7px;padding:10px;font:inherit}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px}.plain{background:#eef3ef;border:0;border-radius:8px;padding:10px 13px;cursor:pointer}@media(max-width:850px){header{height:62px;padding:0 16px;gap:11px}.person{display:none}.nav button{padding:0 8px}.wrap{padding:25px 16px}.stats,.board{grid-template-columns:repeat(2,1fr)}.focus{grid-template-columns:1fr}.routine{grid-template-columns:1fr 1fr}.calendar{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.intro{align-items:flex-start;flex-direction:column}.stats,.board,.twocol{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}.routine,.report{grid-template-columns:1fr}.nav button:nth-child(n+4){display:none}}
</style></head><body><header><div class="brand"><b>◒</b>Agend.a</div><nav class="nav"><button class="active" data-view="overview">Visão geral</button><button data-view="kanban">Kanban</button><button data-view="calendar">Calendário</button><button data-view="routines">Rotinas</button><button data-view="reports">Relatórios</button></nav><div class="person"><b>Líder da equipe</b><small>Acesso total</small></div></header><main class="wrap"><div class="intro"><div><div class="eyebrow">Operação da equipe</div><h1 id="heading">Visão geral</h1><p class="sub" id="today"></p></div><button class="primary" id="newTask">+ Nova atividade</button></div><div class="areas" id="areas"></div><section class="view active" id="overview"></section><section class="view" id="kanban"></section><section class="view" id="calendar"></section><section class="view" id="routines"></section><section class="view" id="reports"></section></main><div class="modal" id="modal"><div class="dialog"><h2>Nova atividade</h2><form class="form" id="form"><label>Título<input id="title" required></label><label>Descrição<textarea id="description" rows="3"></textarea></label><div class="twocol"><label>Área<select id="area"></select></label><label>Responsável<select id="assignee"><option>Colaborador 1</option><option>Colaborador 2</option><option>Colaborador 3</option><option>Colaborador 4</option></select></label></div><div class="twocol"><label>Prazo<input id="due_date" type="date" required></label><label>Prioridade<select id="priority"><option>normal</option><option>média</option><option>alta</option></select></label></div><label>Recorrência<select id="recurrence"><option>não se repete</option><option>diária</option><option>semanal</option><option>mensal</option><option>anual</option></select></label><div class="actions"><button class="plain" type="button" id="cancel">Cancelar</button><button class="primary">Criar atividade</button></div></form></div></div><script>
const areas=['Todas','Administrativo','Logística · Defensivo','Logística · Adubo','Planejamento'],status=['todo','andamento','revisão','concluída'],labels={todo:'A fazer',andamento:'Em andamento',revisão:'Em revisão',concluída:'Concluídas'};let tasks=[],filter='Todas',view='overview';const $=s=>document.querySelector(s),fmt=d=>d?new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'Sem prazo',scoped=()=>filter==='Todas'?tasks:tasks.filter(t=>t.area===filter),esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderAreas(){$('#areas').innerHTML=areas.map(a=>'<button class="area '+(a===filter?'active':'')+'" onclick="chooseArea('+JSON.stringify(a)+')">'+a.replace('Logística · ','')+'</button>').join('');$('#area').innerHTML=areas.slice(1).map(a=>'<option>'+a+'</option>').join('')}
function card(t){return '<article class="card '+(t.priority==='alta'?'high':t.priority==='média'?'medium':'')+'" onclick="advance('+t.id+')"><b>'+esc(t.title)+'</b><p>'+esc(t.description)+'</p><div class="meta"><span>'+esc(t.assignee)+'</span><span>'+fmt(t.due_date)+'</span></div></article>'}
function overview(){let a=scoped(),d=a.filter(t=>t.status==='concluída').length,l=a.filter(t=>t.due_date&&t.due_date<'2026-11-23'&&t.status!=='concluída').length;$('#overview').innerHTML='<div class="stats"><div class="stat"><span>Atividades</span><strong>'+a.length+'</strong><em>na área selecionada</em></div><div class="stat"><span>Em andamento</span><strong>'+a.filter(t=>t.status==='andamento').length+'</strong><em>em execução</em></div><div class="stat"><span>Concluídas</span><strong>'+d+'</strong><em>'+Math.round(d/(a.length||1)*100)+'% do total</em></div><div class="stat"><span>Atrasadas</span><strong>'+l+'</strong><em style="color:var(--red)">precisam de atenção</em></div></div><div class="focus"><div class="panel"><h2>Próximas entregas</h2><div class="list">'+a.slice(0,5).map(t=>'<div class="item"><i class="dot"></i><div><b>'+esc(t.title)+'</b><small>'+esc(t.area)+' · '+esc(t.assignee)+'</small></div><time>'+fmt(t.due_date)+'</time></div>').join('')+'</div></div><div class="panel"><h2>Dados persistentes</h2><p class="sub">Atividades criadas aqui ficam gravadas no banco Neon e aparecem em todas as visões.</p></div></div>'}
function kanban(){$('#kanban').innerHTML='<div class="panel"><h2>Fluxo de trabalho</h2><div class="board">'+status.map(s=>{let a=scoped().filter(t=>t.status===s);return '<div class="col"><h3>'+labels[s]+' <span class="count">'+a.length+'</span></h3>'+a.map(card).join('')+(a.length?'':'<div class="empty">Sem atividades</div>')+'</div>'}).join('')+'</div></div>'}
function calendar(){let a=scoped(),days=[...new Set(a.filter(t=>t.due_date).map(t=>t.due_date))].slice(0,14);$('#calendar').innerHTML='<div class="panel"><h2>Agenda de entregas</h2><div class="calendar">'+(days.map(d=>'<div class="day"><span>'+fmt(d)+'</span>'+a.filter(t=>t.due_date===d).map(t=>'<div class="event">'+esc(t.title)+'</div>').join('')+'</div>').join('')||'<div class="empty">Ainda não há prazos cadastrados.</div>')+'</div></div>'}
function routines(){let a=scoped().filter(t=>t.recurrence!=='não se repete');$('#routines').innerHTML='<div class="panel"><h2>Atividades recorrentes</h2>'+(a.map(t=>'<div class="routine"><div><b>'+esc(t.title)+'</b><small class="sub" style="display:block">'+esc(t.area)+' · '+esc(t.assignee)+'</small></div><div>'+esc(t.recurrence)+'</div><div class="bar"><i style="width:'+t.progress+'%"></i></div><div>'+t.progress+'%</div></div>').join('')||'<div class="empty">Nenhuma rotina encontrada.</div>')+'</div>'}
function reports(){$('#reports').innerHTML='<div class="panel"><h2>Produtividade por área</h2>'+areas.slice(1).map(a=>{let x=tasks.filter(t=>t.area===a),d=x.filter(t=>t.status==='concluída').length,p=Math.round(d/(x.length||1)*100);return '<div class="report"><b>'+a+'</b><div class="bar"><i style="width:'+p+'%"></i></div><span>'+d+'/'+x.length+' concluídas</span></div>'}).join('')+'</div>'}
function render(){renderAreas();overview();kanban();calendar();routines();reports();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===view));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));$('#heading').textContent={overview:'Visão geral',kanban:'Kanban',calendar:'Calendário',routines:'Rotinas',reports:'Relatórios'}[view]}
function chooseArea(a){filter=a;render()}async function advance(id){let t=tasks.find(x=>x.id===id),next=status[(status.indexOf(t.status)+1)%status.length],p=next==='concluída'?100:next==='andamento'?Math.max(20,t.progress):t.progress;await fetch('/api/tasks',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:next,progress:p})});load()}async function load(){try{let r=await fetch('/api/tasks');tasks=await r.json();render()}catch(e){$('#overview').innerHTML='<div class="panel">Não foi possível carregar o banco de dados.</div>'}}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#today').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());$('#newTask').onclick=()=>$('#modal').classList.add('open');$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#form').onsubmit=async e=>{e.preventDefault();let body={title:$('#title').value,description:$('#description').value,area:$('#area').value,assignee:$('#assignee').value,due_date:$('#due_date').value,priority:$('#priority').value,recurrence:$('#recurrence').value};let r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(r.ok){$('#modal').classList.remove('open');e.target.reset();load()}};load();
</script></body></html>
