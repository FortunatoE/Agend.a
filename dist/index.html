let workSearch='',workColumns=['area','assignee','due_date','priority','status','progress'];const workFields={area:'Área',assignee:'Responsável',due_date:'Prazo',priority:'Prioridade',status:'Status',progress:'Progresso'};
function workTable(){const root=$('#table');if(!root)return;root.innerHTML='<div class="panel"><h2>Quadro de atividades</h2><div class="work-tools"><input id="workSearch" placeholder="Buscar atividades" aria-label="Buscar atividades"><details><summary>Colunas</summary>'+Object.entries(workFields).map(([k,v])=>'<label style="display:block"><input type="checkbox" data-field="'+k+'" '+(workColumns.includes(k)?'checked':'')+'> '+v+'</label>').join('')+'</details></div><div class="work-grid" id="workRows"></div></div>';const search=$('#workSearch');search.value=workSearch;search.oninput=()=>{workSearch=search.value;workRows()};root.querySelectorAll('[data-field]').forEach(c=>c.onchange=()=>{workColumns=c.checked?[...workColumns,c.dataset.field]:workColumns.filter(k=>k!==c.dataset.field);workRows()});const note=node('div',undefined,'ui-filter-note');if(uiTaskFilter!=='all'){note.append(node('b','Filtro: '+(uiTaskFilter==='late'?'Atrasadas':labels[uiTaskFilter]||uiTaskFilter)),wsButton('Limpar filtro',()=>{uiTaskFilter='all';workTable()}));root.querySelector('.work-tools').after(note)}workRows()}
function workRows(){let rows=scoped().filter(t=>uiTaskFilter==='all'||(uiTaskFilter==='late'?AgendaDates.overdue(t):t.status===uiTaskFilter)).filter(t=>[t.title,t.area,t.assignee].some(v=>String(v||'').toLocaleLowerCase().includes(workSearch.toLocaleLowerCase())));$('#workRows').innerHTML='<table><thead><tr><th>Atividade</th>'+workColumns.map(k=>'<th>'+workFields[k]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(t=>'<tr><td><button onclick="detail('+Number(t.id)+')">'+esc(t.title)+'</button></td>'+workColumns.map(k=>'<td>'+(k==='status'&&can('edit')?'<select aria-label="Status" data-task="'+Number(t.id)+'">'+statuses.map(st=>'<option value="'+st+'" '+(st===t.status?'selected':'')+'>'+labels[st]+'</option>').join('')+'</select>':esc(k==='status'?labels[t.status]||t.status:k==='progress'?String(t.progress)+'%':k==='due_date'?fmt(t.due_date):t[k]))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">Nenhuma atividade encontrada.</div>');$('#workRows').querySelectorAll('[data-task]').forEach(el=>el.onchange=async()=>{el.disabled=true;try{await api('/api/tasks',{method:'PATCH',body:JSON.stringify({id:Number(el.dataset.task),status:el.value})});await load();toast('Status atualizado.','success')}catch(e){toast(e.message,'error');workRows()}})}
function render(){renderAreas();const views={overview,table:workTable,kanban,calendar,routines,reports,settings:()=>{if(current?.is_admin)settings().catch(e=>toast(e.message,'error'))}};views[view]?.();document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===view));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===view));$('#heading').textContent={overview:'Visão geral',workspaces:'Ambientes de trabalho',table:'Quadro de atividades',kanban:'Kanban',calendar:'Calendário',routines:'Rotinas',reports:'Relatórios',settings:'Configurações'}[view];$('#newTask').hidden=!can('create')||['workspaces','settings'].includes(view);$('#areas').hidden=['workspaces','settings'].includes(view);uiRefreshShell();if(view==='workspaces')wsLoad()}
function chooseArea(a){filter=a;render()}function setCalendar(m){calendarMode=m;calendar()}async function load(){let [taskRows,box]=await Promise.all([api('/api/tasks'),api('/api/notifications')]);tasks=current?.is_admin?taskRows:taskRows.filter(t=>Number(t.assignee_id)===Number(current.id));inbox=box.notifications;updateNotificationButton();render()}async function advance(id){let t=tasks.find(x=>x.id===id),next=statuses[(statuses.indexOf(t.status)+1)%statuses.length];const result=await api('/api/tasks',{method:'PATCH',body:JSON.stringify({id,status:next})});toast(result.generated?'Rotina concluída e próxima ocorrência criada.':'Status atualizado.');load()}
async function openNotifications(){let box=await api('/api/notifications');inbox=box.notifications;updateNotificationButton();let items=inbox.map(item=>'<div class="comment '+(!item.read_at?'ui-unread':'')+'"><b>'+esc(item.title)+'</b><p class="sub">'+esc(item.message)+'</p><small>'+new Date(item.created_at).toLocaleString('pt-BR')+'</small></div>').join('')||'<div class="empty">Nenhuma notificação por enquanto.</div>';
$('#modal').classList.add('ui-drawer');$('#modal').innerHTML='<div class="dialog"><div class="actions" style="float:right"><button class="plain" onclick="closeModal()">Fechar</button></div><h2>Notificações</h2><p class="sub">Alertas de atividades atribuídas, atualizações, comentários e prazos vencidos.</p><div class="actions"><button class="plain" onclick="markAllNotifications()">Marcar todas como lidas</button></div>'+items+'</div>';$('#modal').classList.add('open')}async function markAllNotifications(){await api('/api/notifications',{method:'PATCH',body:JSON.stringify({action:'read_all'})});await load();closeModal()}
function taskModal(){return '<div class="dialog"><h2>Nova atividade</h2><form class="form" id="taskForm"><label>Título<input id="title" required></label><label>Descrição<textarea id="description" rows="3"></textarea></label><div class="twocol"><label>Área<select id="areaSelect">'+areas.slice(1).map(a=>'<option>'+a+'</option>').join('')+'</select></label><label>Responsável<select id="assignee">'+assignees().map(u=>'<option value="'+Number(u.id)+'">'+esc(u.name)+'</option>').join('')+'</select></label></div><div class="twocol"><label>Prazo<input id="dueDate" type="date" required></label><label>Prioridade<select id="priority"><option>normal</option><option>média</option><option>alta</option></select></label></div><label>Recorrência<select id="recurrence"><option>não se repete</option><option>diária</option><option>semanal</option><option>mensal</option><option>anual</option></select></label><div class="actions"><button class="plain" type="button" onclick="closeModal()">Cancelar</button><button class="primary">Criar atividade</button></div></form></div>'}
function closeModal(){$('#modal').classList.remove('open','ui-drawer');$('#modal').innerHTML=''}async function newTask(){if(!can('create'))return toast('Seu perfil não pode criar atividades.');$('#modal').innerHTML=taskModal();$('#modal').classList.add('open');$('#taskForm').onsubmit=async e=>{e.preventDefault();const submit=$('#taskForm .primary');if(submit.disabled)return;submit.disabled=true;submit.textContent='Criando…';try{await api('/api/tasks',{method:'POST',body:JSON.stringify({title:$('#title').value,description:$('#description').value,area:$('#areaSelect').value,assignee_id:Number($('#assignee').value),due_date:$('#dueDate').value,priority:$('#priority').value,recurrence:$('#recurrence').value})});closeModal();toast('Atividade criada.','success');await load()}catch(e){toast(e.message,'error')}finally{if(submit.isConnected){submit.disabled=false;submit.textContent='Criar atividade'}}}}
async function detail(id){let task=tasks.find(t=>t.id===id);if(!task)return toast('Atividade não encontrada.','error');let data=await api('/api/task-detail?task_id='+id);$('#modal').classList.add('ui-drawer');$('#modal').innerHTML='<div class="dialog"><div class="actions" style="float:right"><button class="plain" onclick="closeModal()">Fechar</button></div><h2>'+esc(task.title)+'</h2><p class="sub">'+esc(task.description)+'</p><p><span class="badge">'+esc(task.area)+'</span> <span class="badge">'+esc(labels[task.status]||task.status)+'</span> '+(can('edit')?'<button class="plain" onclick="advance('+id+')">Avançar status</button>':'')+'</p><div class="ui-detail-meta"><div><small>Responsável</small><b>'+esc(task.assignee||'Sem responsável')+(current?.is_admin&&!task.assignee_id?' (sem vínculo)':'')+'</b></div><div><small>Prazo</small><b>'+esc(fmt(task.due_date))+'</b></div><div><small>Prioridade</small><b>'+esc(task.priority||'normal')+'</b></div></div>'+(current?.is_admin?'<div id="taskReassign"></div>':'')+'<div class="detail-section"><h3>Checklist</h3>'+data.checklist.map(i=>'<label class="check"><input type="checkbox" '+(i.done?'checked':'')+' onchange="toggleCheck('+id+','+i.id+')"> '+esc(i.label)+'</label>').join('')+(can('edit')?'<div class="actions"><input id="checkLabel" placeholder="Nova etapa"><button class="plain" onclick="addCheck('+id+')">Adicionar</button></div>':'')+'</div><div class="detail-section"><h3>Comentários</h3>'+data.comments.map(c=>'<div class="comment"><b>'+esc(c.author)+'</b> '+esc(c.message)+'<small>'+new Date(c.created_at).toLocaleString('pt-BR')+'</small></div>').join('')+'<div class="actions"><input id="commentText" placeholder="Escreva um comentário"><button class="plain" onclick="comment('+id+')">Enviar</button></div></div><div class="detail-section"><h3>Anexos</h3><div class="attachments">'+data.attachments.map(a=>'<a target="_blank" href="/api/attachment?path='+encodeURIComponent(a.pathname)+'">⌁ '+esc(a.filename)+'</a>').join('')+'</div>'+(can('edit')?'<input type="file" id="uploadFile" onchange="uploadFile('+id+',this)">':'')+'</div><div class="detail-section"><h3>Histórico</h3>'+data.history.map(h=>'<div class="comment"><b>'+esc(h.author)+'</b> '+esc(h.detail)+'<small>'+new Date(h.created_at).toLocaleString('pt-BR')+'</small></div>').join('')+'</div></div>';$('#modal').classList.add('open');if(current?.is_admin)renderTaskReassign(task)}
async function refreshDetail(id){await load();detail(id)}async function addCheck(id){let label=$('#checkLabel').value;if(!label)return;await api('/api/task-detail',{method:'POST',body:JSON.stringify({task_id:id,action:'checklist_add',label})});refreshDetail(id)}async function toggleCheck(id,item){await api('/api/task-detail',{method:'POST',body:JSON.stringify({task_id:id,action:'checklist_toggle',item_id:item})});refreshDetail(id)}async function comment(id){let message=$('#commentText').value;if(!message)return;await api('/api/task-detail',{method:'POST',body:JSON.stringify({task_id:id,action:'comment',message})});refreshDetail(id)}async function uploadFile(id,input){let f=input.files[0];if(!f)return;if(f.size>4*1024*1024)return toast('Envie anexos de até 4 MB.');let reader=new FileReader();reader.onload=async()=>{try{await api('/api/upload',{method:'POST',body:JSON.stringify({task_id:id,filename:f.name,content_type:f.type,data:String(reader.result).split(',')[1]})});toast('Anexo enviado.');refreshDetail(id)}catch(e){toast(e.message,'error')}};reader.readAsDataURL(f)}
async function createUser(e){e.preventDefault();let profile=$('#newRole').value;try{await api('/api/users',{method:'POST',body:JSON.stringify({name:$('#newName').value,username:$('#newUsername').value,password:$('#newPassword').value,is_admin:profile==='admin',can_create:true,can_edit:profile!=='collab'||true,can_delete:profile==='admin'})});team=await api('/api/team');toast('Usuário criado.');settings()}catch(e){toast(e.message,'error')}}async function saveUser(id){let row=document.querySelector('[data-user="'+id+'"]'),read=k=>row.querySelector('[data-k="'+k+'"]').checked;try{await api('/api/users',{method:'PATCH',body:JSON.stringify({id,is_admin:read('is_admin'),can_create:read('can_create'),can_edit:read('can_edit'),can_delete:read('can_delete')})});toast('Acessos atualizados.')}catch(e){toast(e.message,'error')}}
async function login(e){e.preventDefault();const submit=$('#loginForm .primary');if(submit.disabled)return;submit.disabled=true;submit.textContent='Entrando…';$('#loginError').textContent='';try{let r=await api('/api/auth',{method:'POST',body:JSON.stringify({action:'login',username:$('#loginUser').value,password:$('#loginPassword').value})});await start(r.user)}catch(e){$('#loginError').textContent=e.message}finally{submit.disabled=false;submit.textContent='Entrar'}}async function start(user){current=user;calendarMode=user.is_admin?'equipe':'mensal';$('#loginScreen').hidden=true;$('#app').hidden=false;$('#personName').textContent=user.name;$('#personRole').textContent=user.is_admin?'Administrador':'Colaborador';$('#settingsNav').hidden=!user.is_admin;team=await api('/api/team').catch(()=>[]);if(new URLSearchParams(location.search).has('form'))view='workspaces';await load()}async function boot(){try{let r=await api('/api/auth');if(r.user)await start(r.user)}catch(e){$('#loginError').textContent=e.message;uiToast(e.message,'error')}}$('#loginForm').onsubmit=login;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{uiTaskFilter='all';view=b.dataset.view;render()});$('#newTask').onclick=newTask;$('#logout').onclick=async()=>{await api('/api/auth',{method:'POST',body:JSON.stringify({action:'logout'})});location.reload()};$('#theme').onclick=()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;$('#app').dataset.theme=t;localStorage.setItem('agenda-theme',t);render()};$('#notifications').onclick=openNotifications;let saved=localStorage.getItem('agenda-theme')||'light';document.documentElement.dataset.theme=saved;$('#app').dataset.theme=saved;$('#today').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
</script><script src="/task-dates.js"></script><script src="/task-views.js"></script><script src="/team-calendar.js"></script><script src="/workspaces.js"></script><script src="/automations.js"></script><script src="/workflows.js"></script><script src="/forms.js"></script><script src="/governance.js"></script><script src="/exchange-core.js"></script><script src="/exchange.js"></script><script src="/api-keys.js"></script><script src="/webhooks.js"></script><script src="/analytics-core.js"></script><script src="/advanced-views.js"></script><script src="/board-core.js"></script><script src="/board-experience.js"></script><link rel="stylesheet" href="/advanced-views.css"><link rel="stylesheet" href="/board-experience.css"><script src="/security.js"></script><link rel="stylesheet" href="/product-experience.css"><link rel="stylesheet" href="/team-calendar.css"><script src="/product-experience.js"></script><script>uiInit();boot();</script></body></html>
