<rect x="35" y="130" width="300" height="90" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="36" y="131" width="5" height="88" rx="2" fill="#168353"/><text x="51" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">1 · Entrada</text><text x="51" y="179" font-family="Arial,sans-serif" font-size="13" fill="#436052">Interface, formulário, CSV/XLSX</text><text x="51" y="198" font-family="Arial,sans-serif" font-size="13" fill="#436052">REST POST ou PATCH</text><rect x="400" y="130" width="300" height="90" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="401" y="131" width="5" height="88" rx="2" fill="#168353"/><text x="416" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">2 · Autorização</text><text x="416" y="179" font-family="Arial,sans-serif" font-size="13" fill="#436052">Sessão ou chave de API</text><text x="416" y="198" font-family="Arial,sans-serif" font-size="13" fill="#436052">Validação de tipos e escopo</text><rect x="765" y="130" width="300" height="90" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="766" y="131" width="5" height="88" rx="2" fill="#168353"/><text x="781" y="157" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">3 · Transação SQL</text><text x="781" y="179" font-family="Arial,sans-serif" font-size="13" fill="#436052">Cria ou altera registro</text><text x="781" y="198" font-family="Arial,sans-serif" font-size="13" fill="#436052">Idempotência quando aplicável</text><rect x="765" y="280" width="300" height="90" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="766" y="281" width="5" height="88" rx="2" fill="#168353"/><text x="781" y="307" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">4 · Triggers</text><text x="781" y="329" font-family="Arial,sans-serif" font-size="13" fill="#436052">Captura evento e auditoria</text><text x="781" y="348" font-family="Arial,sans-serif" font-size="13" fill="#436052">Automações e workflows</text><rect x="400" y="280" width="300" height="90" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="401" y="281" width="5" height="88" rx="2" fill="#168353"/><text x="416" y="307" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">5 · Fila persistente</text><text x="416" y="329" font-family="Arial,sans-serif" font-size="13" fill="#436052">Cursor por Board</text><text x="416" y="348" font-family="Arial,sans-serif" font-size="13" fill="#436052">Consulta REST / webhook</text><rect x="35" y="280" width="300" height="90" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="36" y="281" width="5" height="88" rx="2" fill="#168353"/><text x="51" y="307" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">6 · Entrega</text><text x="51" y="329" font-family="Arial,sans-serif" font-size="13" fill="#436052">Lease e HMAC-SHA256</text><text x="51" y="348" font-family="Arial,sans-serif" font-size="13" fill="#436052">HTTPS, timeout, sem redirect</text><rect x="35" y="445" width="300" height="85" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="36" y="446" width="5" height="83" rx="2" fill="#168353"/><text x="51" y="472" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">7 · Sucesso</text><text x="51" y="494" font-family="Arial,sans-serif" font-size="13" fill="#436052">HTTP 2xx</text><text x="51" y="513" font-family="Arial,sans-serif" font-size="13" fill="#436052">Avança cursor</text><rect x="400" y="445" width="300" height="85" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="401" y="446" width="5" height="83" rx="2" fill="#168353"/><text x="416" y="472" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">8 · Falha</text><text x="416" y="494" font-family="Arial,sans-serif" font-size="13" fill="#436052">Backoff: 1, 2, 4, 8 min</text><text x="416" y="513" font-family="Arial,sans-serif" font-size="13" fill="#436052">Bloqueia na quinta falha</text><rect x="765" y="445" width="300" height="85" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="766" y="446" width="5" height="83" rx="2" fill="#168353"/><text x="781" y="472" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">9 · Monitoramento</text><text x="781" y="494" font-family="Arial,sans-serif" font-size="13" fill="#436052">Histórico de tentativas</text><text x="781" y="513" font-family="Arial,sans-serif" font-size="13" fill="#436052">Liberação manual</text>
<text x="36" y="590" font-family="Arial,sans-serif" font-size="12" fill="#436052">O worker precisa de agendamento externo. A entrega pode repetir; o consumidor deve deduplicar.</text></svg>