<text x="36" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#d2ec93">agend.a 2.0 | Fluxo de processamento</text><text x="36" y="72" font-family="Arial,sans-serif" font-size="15" fill="#e4f3e8">Da entrada de dados à entrega de eventos externos</text>
