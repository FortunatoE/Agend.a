mits</text><text x="51" y="382" font-family="Arial,sans-serif" font-size="13" fill="#436052">Não equivale a deploy</text><rect x="400" y="295" width="300" height="105" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="401" y="296" width="5" height="103" rx="2" fill="#168353"/><text x="416" y="322" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">Preview Vercel</text><text x="416" y="344" font-family="Arial,sans-serif" font-size="13" fill="#436052">Banco separado de produção</text><text x="416" y="363" font-family="Arial,sans-serif" font-size="13" fill="#436052">Login, migrações e smoke test</text><text x="416" y="382" font-family="Arial,sans-serif" font-size="13" fill="#436052">Credenciais via ambiente</text><rect x="765" y="295" width="300" height="105" rx="11" fill="#ffffff" stroke="#a9c4b2"/><rect x="766" y="296" width="5" height="103" rx="2" fill="#168353"/><text x="781" y="322" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#153b2a">Produção Vercel</text><text x="781" y="344" font-family="Arial,sans-serif" font-size="13" fill="#436052">Projeto vinculado ao repositório</text><text x="781" y="363" font-family="Arial,sans-serif" font-size="13" fill="#436052">Banco Neon e backup</text><text x="781" y="382" font-family="Arial,sans-serif" font-size="13" fill="#436052">Monitoramento e rollback</text>
