name: Work OS validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d agend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGEND_TEST_DATABASE_URL: postgres://test:test@localhost:5432/agend_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false pg@8
      - name: Validate JavaScript syntax
        run: find api lib dist test -name '*.js' -print0 | xargs -0 -n 1 node --check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/board.spec.js --workers=1 --reporter=line
